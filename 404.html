<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Digitalaikart</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a1628;--navy-2:#0f1f38;--navy-3:#152a48;--gold:#d4a73a;--gold-2:#c9a227;--gold-soft:rgba(212,167,58,.14);--cream:#f8f5ef;--text-dim:rgba(248,245,239,.72);--line:rgba(212,167,58,.22);--serif:'Playfair Display',Georgia,serif;--sans:'Plus Jakarta Sans',-apple-system,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--navy);color:var(--cream);line-height:1.65;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,rgba(212,167,58,.10),transparent 55%);pointer-events:none}
.card{position:relative;z-index:1;max-width:520px;width:100%}
.code{font-family:var(--serif);font-size:5rem;font-weight:800;color:var(--gold);line-height:1;margin-bottom:14px}
h1{font-family:var(--serif);font-size:1.6rem;font-weight:700;margin-bottom:10px}
p{color:var(--text-dim);font-size:1rem;margin-bottom:28px}
.btn{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:15px;padding:14px 30px;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--gold-2));color:var(--navy);text-decoration:none;box-shadow:0 8px 26px rgba(212,167,58,.25)}
.btn:hover{transform:translateY(-2px)}
.diamond{display:inline-block;width:7px;height:7px;background:var(--gold);transform:rotate(45deg);margin:0 6px;vertical-align:middle;opacity:.8}
</style>
</head>
<body>
<div class="card">
  <div class="code">404</div>
  <h1>Page Not Found</h1>
  <p><span class="diamond"></span>The page you're looking for doesn't exist.<span class="diamond"></span></p>
  <a href="/" class="btn">← Back to Digitalaikart</a>
</div>
</body>
</html>
