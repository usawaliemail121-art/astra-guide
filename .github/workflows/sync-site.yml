name: Sync site files from release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f cover.jpg index.html GPT6_Astra_Zero_to_Hero_Guide.pdf
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --clobber

      - name: Transform index.html for GitHub Pages
        run: |
          perl -pi -e 's|https://usmanikart\.shop/cover\.jpg|https://usawaliemail121-art.github.io/astra-guide/cover.jpg|g' index.html
          perl -pi -e 's|https://usmanikart\.shop/|https://usawaliemail121-art.github.io/astra-guide/|g' index.html
          perl -pi -e 's/src="data:image\/jpeg;base64,[^"]*"/src="cover.jpg"/g' index.html
          perl -pi -e 's/digital: 999/digital: 149/g' index.html
          perl -pi -e 's/RAZORPAY_KEY_ID = ""/RAZORPAY_KEY_ID = "rzp_live_RMsUyWDL4250IU"/' index.html
          perl -0777 -pi -e 's~// TODO: send response\.razorpay_payment_id to your backend~window.location.href = "thank-you.html" + (plan === "combo" ? "?product=combo" : "");~' index.html
          perl -0777 -pi -e 's~alert\("Payment successful!.*?gmail\.com"\);~~s' index.html
          perl -pi -e 's/alert\("Payment failed: " \+ resp\.error\.description\);/setTimeout(function(){ try{ rzp.close(); }catch(e){} alert("Payment failed. Please try again."); }, 300);/' index.html

      - name: Improve Razorpay checkout (modal cleanup + retry)
        run: |
          cat > patch.py << 'PYEOF'
          with open("index.html", "r") as f:
              h = f.read()
          old_theme = 'theme: { color: "#0a1628" }\n  };'
          new_theme = 'theme: { color: "#0a1628" },\n    modal: {\n      ondismiss: function() {\n        document.querySelectorAll(".razorpay-container, .razorpay-backdrop, iframe[data-rzp]").forEach(function(el) { el.remove(); });\n        document.body.style.removeProperty("overflow");\n        document.body.style.removeProperty("position");\n      },\n      escape: true,\n      backdropclose: true\n    },\n    retry: {\n      enabled: true,\n      max_count: 3\n    }\n  };'
          if old_theme in h:
              h = h.replace(old_theme, new_theme)
              print("PATCHED: modal+retry added")
          else:
              print("SKIP: theme block not found")
          old_fail = 'setTimeout(function(){ try{ rzp.close(); }catch(e){} alert("Payment failed. Please try again."); }, 300);'
          new_fail = 'console.log("Payment failed:", resp.error);\n    try { rzp.close(); } catch(e) {}\n    setTimeout(function() {\n      document.querySelectorAll(".razorpay-container, .razorpay-backdrop, iframe[data-rzp]").forEach(function(el) { el.remove(); });\n      document.body.style.removeProperty("overflow");\n      document.body.style.removeProperty("position");\n      alert("Payment failed. Please try again.");\n    }, 500);'
          if old_fail in h:
              h = h.replace(old_fail, new_fail)
              print("PATCHED: failure handler improved")
          else:
              print("SKIP: failure handler not found")
          with open("index.html", "w") as f:
              f.write(h)
          PYEOF
          python3 patch.py

      - name: Ensure .nojekyll
        run: touch .nojekyll

      - name: Commit site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync site files from release v1.0.0" || echo "Nothing to commit"
          git push
