name: Sync site files from release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f cover.jpg
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --clobber

      - name: Ensure .nojekyll
        run: touch .nojekyll

      - name: Commit site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync site files from release v1.0.0" || echo "Nothing to commit"
          git push
